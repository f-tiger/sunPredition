name: Method audit checks
on: [pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test test/ledger-audit.test.mjs
      - run: node test/rules.test.mjs
      - run: node test/growth.test.mjs
      - run: npx -y esbuild@0.25 src/index.js --bundle --format=esm --outfile=/dev/null
