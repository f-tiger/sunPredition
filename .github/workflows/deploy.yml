name: Deploy SunWatch to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/sun-yuchen-investment-research-yzz9mx
    paths: ["src/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        id: wrangler
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test + initial fetch
        run: |
          URL="${{ steps.wrangler.outputs.deployment-url }}"
          echo "Deployed at: $URL"
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
          echo "dashboard HTTP $code"
          test "$code" = "200"
          # 结账路径必须每次部署都验一遍:它断过一次(定价页写"联系站长"但全站没有联系方式),
          # 而它断掉时的表现和"没人想买"完全一样,不会有任何报错。
          # 新版本传播需要时间,首次上线时 5 秒后断言会拿到旧版本的 404——所以重试而不是一击定生死。
          buy=""
          for i in 1 2 3 4 5 6; do
            buy=$(curl -s -o /dev/null -w "%{http_code}" "$URL/go/buy")
            [ "$buy" = "302" ] && break
            echo "buy route not live yet (HTTP $buy), retry $i"
            sleep 5
          done
          echo "buy redirect HTTP $buy"
          test "$buy" = "302"
          curl -s -o /dev/null -w "%{redirect_url}\n" "$URL/go/buy" | grep -q "t.me/sunwatchBot" \
            && echo "buy -> telegram OK" || { echo "buy redirect target wrong"; exit 1; }
          curl -s "$URL/" | grep -q "/go/buy" || { echo "pricing card missing buy button"; exit 1; }
          # 收款地址只能出现在 bot 私信里。一旦被渲染进公开页面,它会被抓取归档,
          # 而链上余额与全部往来记录任何人都能查——这条断言就是防这个回归。
          for path in "/" "/faq" "/track-record"; do
            curl -s "$URL$path" | grep -qi "0xBc2a5eB" \
              && { echo "LEAK: USDT address rendered on public page $path"; exit 1; } || true
          done
          echo "usdt address not on public pages OK"
          # 自定义域验证:invest.agiscorecard.com 应与 workers.dev 同源同代码。
          # 首次注册 DNS/证书可能要几分钟,失败只警告不阻塞(workers.dev 仍在服务)。
          inv=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://invest.agiscorecard.com/" || echo 000)
          echo "invest.agiscorecard.com HTTP $inv"
          [ "$inv" = "200" ] && echo "custom domain OK" || echo "custom domain not ready yet (non-blocking)"
          # 多语言:①/en 必须真的渲染英文落地页;②带英文 Accept-Language 的浏览器 UA
          # 打 / 必须 302 到 /en。语言协商是并域改造的核心,断了和"没做"看起来一样。
          curl -s "$URL/en" | grep -q "Market calls you can audit" \
            && echo "EN landing OK" || { echo "EN landing broken"; exit 1; }
          loc=$(curl -s -o /dev/null -w "%{redirect_url}" -A "Mozilla/5.0" -H "accept-language: en-US,en;q=0.9" "$URL/")
          echo "negotiation redirect -> $loc"
          echo "$loc" | grep -q "/en" && echo "lang negotiation OK" || { echo "lang negotiation broken"; exit 1; }
          # 中文浏览器不该被赶去英文页
          zh=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" -H "accept-language: zh-CN,zh;q=0.9" "$URL/")
          test "$zh" = "200" && echo "zh direct 200 OK" || { echo "zh visitor redirected wrongly"; exit 1; }
          echo "refresh result:"
          curl -sf "$URL/api/refresh"
          echo
          echo "quotes:"
          curl -s "$URL/api/refresh-quotes" || true
          echo
          # 每次部署把全部报价打进日志:沙箱直连 workers.dev 403,这里是会话能读到
          # 实时行情的唯一通道;顺带每次部署留一份行情快照存档。
          echo "quote snapshot:"
          curl -s "$URL/api/quotes" | python3 -c "
          import json,sys
          try: q=json.load(sys.stdin).get('quotes',[])
          except Exception: q=[]
          for x in q:
              fl=x.get('fromLowPct'); oh=x.get('offHighPct')
              extra=(' 距52周低+'+str(fl)+'%') if fl is not None else ''
              extra+=(' 距高'+str(oh)+'%') if oh is not None else ''
              print(f\"{x.get('symbol','?'):12} {x.get('name','?'):8} {x.get('price')}{x.get('currency','')} 日{x.get('changePct')}%{extra}\")
          " || true
          curl -sf "$URL/api/feed" | head -c 400
          echo
      - name: Bootstrap Pro (webhook + first code, idempotent)
        run: |
          URL="${{ steps.wrangler.outputs.deployment-url }}"
          echo "bootstrap:"
          curl -s "$URL/api/bootstrap-pro" || true
          echo
      - name: Ping IndexNow (auto search-engine indexing)
        run: |
          URL="${{ steps.wrangler.outputs.deployment-url }}"
          echo "indexnow:"
          curl -s "$URL/api/ping-indexnow" || true
          echo
      - name: Push monitoring summary to Telegram
        run: |
          URL="${{ steps.wrangler.outputs.deployment-url }}"
          echo "push summary:"
          curl -s "$URL/api/push-summary" || true
          echo
