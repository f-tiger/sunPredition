name: Deploy SunWatch to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/sun-yuchen-investment-research-yzz9mx
    paths: ["src/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
